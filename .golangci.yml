version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: indent-error-flow
        - name: unreachable-code
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters: [revive]
        text: "exported|package-comments"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/elliottsam/kubectl-schematree
